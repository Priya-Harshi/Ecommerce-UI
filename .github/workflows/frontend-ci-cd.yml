name: Frontend CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://localhost:7000
        run: npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build image
        env:
          IMAGE_TAG: ghcr.io/priya-harshi/ecommerce-ui:${{ github.sha }}
        run: |
          podman build \
            --build-arg VITE_API_BASE_URL=https://localhost:7000 \
            -f Containerfile \
            -t "$IMAGE_TAG" \
            .

      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ghcr.io/priya-harshi/ecommerce-ui:${{ github.sha }}
        run: podman push "$IMAGE_TAG"
